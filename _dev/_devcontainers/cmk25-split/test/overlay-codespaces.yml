# Pulled verbatim from a real Codespace on 2026-08-31 from
# /workspaces/.codespaces/.persistedshare/docker-compose.codespaces.yml
# Kept here so a lab can be checked against what Codespaces really merges in.
services:
  host:
    volumes:
    - /root/.codespaces/shared:/workspaces/.codespaces/shared:rw
    - /var/lib/docker/codespacemount/.persistedshare:/workspaces/.codespaces/.persistedshare:rw
    - /.codespaces/agent/mount:/.codespaces/bin:rw
    - /mnt/containerTmp:/tmp:rw
    - /var/lib/docker/codespacemount/workspace:/workspaces:rw
    labels:
      Type: codespaces
      ContainerVersion: '13'
    environment:
    - CODESPACES=true
...

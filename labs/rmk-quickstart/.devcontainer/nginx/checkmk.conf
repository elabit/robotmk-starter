# Why a proxy and not socat, and why this one directive matters:
#
# GitHub's port forwarding hands the container "Host: localhost:5000". Checkmk's
# Apache builds the redirect for /cmk/ out of that Host, so it answers
#
#     Location: http://localhost:5000/cmk/check_mk/
#
# which sends the browser to the LEARNER's own machine, where nothing listens.
# socat forwards raw TCP and cannot touch a header.
#
# proxy_redirect looks like the fix and does not work here — measured, with the
# exact prefix form, the regex form, and with proxy_redirect off: the Location
# came through unchanged every time. So the one offending redirect is answered
# here instead, relatively. Everything after it is already relative: Checkmk's
# own chain (/cmk/check_mk/ -> login.py -> index.py) uses relative Locations.
#
# Relative Locations are valid (RFC 9110) and are what we want: the browser stays
# on whatever host it arrived on — the forwarded github.dev address, localhost
# during local work, or a tunnel.
# GitHub's proxy hands us "Host: localhost:5000" but does tell us the real one:
#     host=localhost:5000
#     x_forwarded_host=<name>-5000.app.github.dev
#     x_forwarded_proto=https   x_forwarded_port=443
# Measured. Passing the real name upstream means Checkmk builds correct absolute
# URLs by itself, so this is not limited to the one redirect we intercept.
map $http_x_forwarded_host $upstream_host {
    ''      $http_host;
    default $http_x_forwarded_host;
}

map $http_x_forwarded_proto $upstream_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5000;
    server_name _;

    # nginx must not turn our relative redirect back into an absolute one.
    absolute_redirect off;

    # Diagnostic: what does the forwarding proxy actually tell us? Kept because
    # this question came up twice and guessing at it cost days.
    location = /__lab_headers {
        default_type text/plain;
        return 200 "host=$http_host\nx_forwarded_host=$http_x_forwarded_host\nx_forwarded_proto=$http_x_forwarded_proto\nx_forwarded_port=$http_x_forwarded_port\nforwarded=$http_forwarded\norigin=$http_origin\nreferer=$http_referer\nscheme=$scheme\n";
    }

    # The forwarded address a learner clicks is the bare root. Checkmk answers it
    # with an absolute redirect to http://<host>/cmk/ — right host, wrong scheme,
    # because Apache does not know the request arrived over TLS. Rather than
    # teach it, answer both entry points here, relatively: the browser keeps its
    # own scheme and host, and lands on the login page in one hop.
    location = / {
        return 302 /cmk/check_mk/;
    }

    location = /cmk/ {
        return 302 /cmk/check_mk/;
    }

    location / {
        proxy_pass http://cmk:5000;
        proxy_set_header Host              $upstream_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;

        # noVNC is not behind this proxy, but Checkmk uses websockets too.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

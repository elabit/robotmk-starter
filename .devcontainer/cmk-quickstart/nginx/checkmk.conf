# Why a proxy and not socat, and why this one directive matters:
#
# GitHub's port forwarding hands the container "Host: localhost:5000". Checkmk's
# Apache builds the redirect for /cmk/ out of that Host, so it answers
#
#     Location: http://localhost:5000/cmk/check_mk/
#
# which sends the browser to the LEARNER's own machine, where nothing listens.
# socat forwards raw TCP and cannot touch a header.
#
# proxy_redirect looks like the fix and does not work here — measured, with the
# exact prefix form, the regex form, and with proxy_redirect off: the Location
# came through unchanged every time. So the one offending redirect is answered
# here instead, relatively. Everything after it is already relative: Checkmk's
# own chain (/cmk/check_mk/ -> login.py -> index.py) uses relative Locations.
#
# Relative Locations are valid (RFC 9110) and are what we want: the browser stays
# on whatever host it arrived on — the forwarded github.dev address, localhost
# during local work, or a tunnel.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5000;
    server_name _;

    # nginx must not turn our relative redirect back into an absolute one.
    absolute_redirect off;

    location = /cmk/ {
        return 302 /cmk/check_mk/;
    }

    location / {
        proxy_pass http://cmk:5000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # noVNC is not behind this proxy, but Checkmk uses websockets too.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
